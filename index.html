<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab-03: Асинхронний JavaScript — завантаження, лобі, звук</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud" hidden></div>
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="lobby" hidden></div>
      </div>
      <div id="help">
        Керування: W/↑ — тяга, A/D або ←/→ — поворот, Пробіл — вогонь. Esc під час завантаження —
        скасувати. Збої для демонстрації: <code>?fail=sprite404|badjson|timeout|abort|lobby-timeout|lobby-500</code>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
